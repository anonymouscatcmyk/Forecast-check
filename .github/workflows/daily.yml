name: Daily NIMH forecast capture

on:
  schedule:
    # GitHub schedules are in UTC and often start late. Three entries cover
    # 13:30 Sofia time in both winter (UTC+2) and summer (UTC+3), plus a backup.
    # The first step lets a run through only after 13:20 Sofia time, and
    # collect.py keeps the first capture of the day, so extra runs change nothing.
    - cron: "30 10 * * *"   # 13:30 in summer (12:30 in winter: too early, skipped)
    - cron: "30 11 * * *"   # 13:30 in winter (backup in summer)
    - cron: "30 12 * * *"   # backup
  workflow_dispatch: {}     # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write           # lets the job commit the new data back to the repository

concurrency:
  group: daily-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Is it after 13:20 in Sofia?
        id: when
        run: |
          now=$(TZ=Europe/Sofia date +%H%M)
          run=no
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then run=yes; fi
          if [ "$((10#$now))" -ge 1320 ]; then run=yes; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Sofia time $now, run=$run"

      - uses: actions/checkout@v4
        if: steps.when.outputs.run == 'yes'

      - uses: actions/setup-python@v5
        if: steps.when.outputs.run == 'yes'
        with:
          python-version: "3.12"

      - name: Install packages
        if: steps.when.outputs.run == 'yes'
        run: pip install -r requirements.txt pytest

      - name: Check the parsers on the saved pages
        if: steps.when.outputs.run == 'yes'
        run: python -m pytest -q tests

      - name: Collect forecasts and observations
        if: steps.when.outputs.run == 'yes'
        run: python scripts/collect.py

      - name: Save the results to the repository
        if: steps.when.outputs.run == 'yes'
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data archive
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Data for $(TZ=Europe/Sofia date +%F)"
            git push
          fi

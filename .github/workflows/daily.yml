name: Daily NIMH forecast capture

on:
  schedule:
    # GitHub schedules are in UTC and often start late, so each Sofia time has
    # an entry for winter (UTC+2), one for summer (UTC+3) and a backup. The
    # first step looks at the Sofia clock and decides what the run does:
    #   before 05:00          nothing
    #   05:00 to 13:29        observations only (Stringmeteo, for yesterday)
    #   13:30 or later        forecasts for tomorrow + any observations still missing
    # collect.py changes nothing when the data is already there, so extra runs are harmless.
    - cron: "0 2 * * *"     # 05:00 in summer (04:00 in winter: too early, skipped)
    - cron: "0 3 * * *"     # 05:00 in winter (backup in summer)
    - cron: "0 4 * * *"     # backup
    - cron: "30 10 * * *"   # 13:30 in summer (12:30 in winter: observations only)
    - cron: "30 11 * * *"   # 13:30 in winter (backup in summer)
    - cron: "30 12 * * *"   # backup
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab
    inputs:
      what:
        description: "What to collect"
        type: choice
        default: forecasts and observations
        options:
          - forecasts and observations
          - observations only

permissions:
  contents: write           # lets the job commit the new data back to the repository

concurrency:
  group: daily-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: What should this run do?
        id: when
        run: |
          now=$(TZ=Europe/Sofia date +%H%M)
          mode=skip
          if [ "$((10#$now))" -ge 500 ]; then mode=observations; fi
          if [ "$((10#$now))" -ge 1330 ]; then mode=all; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode=all
            if [ "${{ inputs.what }}" = "observations only" ]; then mode=observations; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Sofia time $now, mode=$mode"

      - uses: actions/checkout@v4
        if: steps.when.outputs.mode != 'skip'

      - uses: actions/setup-python@v5
        if: steps.when.outputs.mode != 'skip'
        with:
          python-version: "3.12"

      - name: Install packages
        if: steps.when.outputs.mode != 'skip'
        run: pip install -r requirements.txt pytest

      - name: Check the parsers on the saved pages
        if: steps.when.outputs.mode != 'skip'
        run: python -m pytest -q tests

      - name: Collect observations (morning run)
        if: steps.when.outputs.mode == 'observations'
        run: python scripts/collect.py --only observations

      - name: Collect forecasts and missing observations (13:30 run)
        if: steps.when.outputs.mode == 'all'
        run: python scripts/collect.py

      - name: Save the results to the repository
        if: always() && steps.when.outputs.mode != 'skip'
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data archive
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Data for $(TZ=Europe/Sofia date +%F)"
            git push
          fi
